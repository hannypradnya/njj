<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sad Darsana — Mahakarya Filsafat Hindu</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-primary: #f39c12;
            --gold-light: #ffeaa7;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-glow: 0 0 20px rgba(212, 175, 55, 0.4);
            --bg-dark: #0a0813;
            --bg-card: rgba(22, 18, 38, 0.75);
            --border-gold: rgba(212, 175, 55, 0.3);
            --text-light: #f4edd3;
            --text-muted: #a39bb8;
            --accent-purple: #2a1b40;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(67, 30, 110, 0.35) 0%, transparent 70%),
                radial-gradient(circle at 0% 100%, rgba(184, 134, 11, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 50%, rgba(42, 27, 64, 0.4) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 20s infinite ease-in-out alternate;
        }
        .orb-1 { width: 350px; height: 350px; background: #d4af37; top: 10%; left: 5%; }
        .orb-2 { width: 450px; height: 450px; background: #6c5ce7; bottom: 10%; right: 5%; animation-delay: -7s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.15); }
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 8, 19, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-gold);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }

        .logo {
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: var(--gold-glow);
        }

        .logo-icon {
            font-size: 1.8rem;
            color: #d4af37;
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #d4af37); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 10px #f39c12); }
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-gold);
            color: var(--text-light);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--gold-gradient);
            opacity: 0.2;
            transition: left 0.4s;
        }

        .nav-btn:hover::before {
            left: 0;
        }

        .nav-btn:hover, .nav-btn.active {
            border-color: #f39c12;
            box-shadow: var(--gold-glow);
            color: #fff;
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: var(--gold-gradient);
            color: #0a0813;
            font-weight: 800;
        }

        main {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-page {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .section-page.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
            position: relative;
        }

        .hero-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 3.2rem;
            margin-bottom: 15px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .hero-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--gold-light);
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .hero-desc {
            max-width: 750px;
            margin: 0 auto 40px;
            line-height: 1.8;
            font-size: 1.05rem;
            color: var(--text-muted);
        }

        .cta-btn {
            background: var(--gold-gradient);
            color: #0a0813;
            border: none;
            padding: 15px 40px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            transition: all 0.4s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .cta-btn:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.8);
        }

        .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .concept-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        .concept-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: var(--gold-gradient);
        }

        .concept-card:hover {
            transform: translateY(-8px);
            border-color: rgba(212, 175, 55, 0.7);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), var(--gold-glow);
        }

        .concept-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.3rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .concept-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-header h2 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.3rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .darsana-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .darsana-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            backdrop-filter: blur(12px);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            cursor: pointer;
        }

        .darsana-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: #f39c12;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(212, 175, 55, 0.3);
        }

        .darsana-number {
            position: absolute;
            top: 20px;
            right: 25px;
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.5rem;
            color: rgba(212, 175, 55, 0.15);
            font-weight: 900;
        }

        .darsana-name {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .darsana-founder {
            font-size: 0.88rem;
            color: var(--gold-primary);
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .darsana-summary {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold-light);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-family: 'Cinzel', serif;
        }

        .bali-tag {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: #fff;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            font-family: 'Cinzel', serif;
            display: inline-block;
            margin-bottom: 10px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 4, 10, 0.85);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: #141024;
            border: 1px solid var(--gold-primary);
            border-radius: 24px;
            max-width: 750px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 35px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), var(--gold-glow);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-gold);
            color: var(--gold-light);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            background: var(--gold-primary);
            color: #0a0813;
        }

        .modal-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2rem;
            color: var(--gold-light);
            margin-bottom: 5px;
        }

        .modal-founder {
            color: var(--gold-primary);
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .modal-body {
            color: var(--text-light);
            line-height: 1.8;
            font-size: 1rem;
        }

        .modal-body h4 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            margin: 20px 0 10px;
            font-size: 1.15rem;
            border-bottom: 1px dashed var(--border-gold);
            padding-bottom: 5px;
        }

        .modal-body ul {
            padding-left: 20px;
            margin-bottom: 15px;
        }

        .modal-body li {
            margin-bottom: 8px;
        }

        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            position: relative;
        }

        .quiz-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-gold);
            padding-bottom: 15px;
        }

        .quiz-progress {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 0.95rem;
        }

        .quiz-score-badge {
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid var(--gold-primary);
            color: var(--gold-light);
            padding: 5px 15px;
            border-radius: 20px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #fff;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.25);
            padding: 16px 20px;
            border-radius: 12px;
            color: var(--text-light);
            text-align: left;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            line-height: 1.5;
        }

        .option-btn:hover:not([disabled]) {
            background: rgba(212, 175, 55, 0.12);
            border-color: var(--gold-primary);
            transform: translateX(5px);
        }

        .option-btn.correct {
            background: rgba(46, 204, 113, 0.2) !important;
            border-color: var(--correct-color) !important;
            color: #2ecc71 !important;
            font-weight: 600;
        }

        .option-btn.wrong {
            background: rgba(231, 76, 60, 0.2) !important;
            border-color: var(--wrong-color) !important;
            color: #e74c3c !important;
        }

        .explanation-box {
            display: none;
            background: rgba(20, 16, 36, 0.9);
            border: 1px solid var(--border-gold);
            border-left: 4px solid var(--gold-primary);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            animation: fadeIn 0.4s ease;
        }

        .explanation-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .explanation-text {
            font-size: 0.93rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .quiz-next-btn {
            display: none;
            margin-top: 25px;
            width: 100%;
            background: var(--gold-gradient);
            color: #0a0813;
            border: none;
            padding: 14px;
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--gold-glow);
        }

        .quiz-next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.8);
        }

        .quiz-result-box {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }

        .result-score {
            font-family: 'Cinzel Decorative', serif;
            font-size: 4rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0;
        }

        .group-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .member-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .member-card:hover {
            transform: translateY(-8px);
            border-color: #f39c12;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), var(--gold-glow);
        }

        .avatar-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.5rem;
            color: #0a0813;
            font-weight: 900;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .member-name {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--gold-light);
            margin-bottom: 5px;
        }
